<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: bold; font-size: 22px; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 15px; fill: #0f172a; }
      .layer-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .box-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; }
      .badge { font-family: monospace; font-size: 11px; font-weight: bold; }
    </style>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#dcfce7"/></linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fefce8"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="layer0" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="500" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="42" class="title">Python Memory Architecture (CPython)</text>
  <text x="40" y="64" class="subtitle">Multi-tier memory allocation hierarchy from high-level Python code to OS Virtual Memory</text>

  <!-- LAYER +3 -->
  <g filter="url(#shadow)">
    <rect x="40" y="85" width="770" height="75" rx="8" fill="url(#layer3)" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="55" y="98" width="70" height="22" rx="4" fill="#2563eb"/>
    <text x="63" y="113" class="badge" fill="#ffffff">Layer +3</text>
    <text x="135" y="114" class="layer-title">User Application Level</text>
    <text x="135" y="138" class="layer-desc">Python Code: Variables, Lists, Dicts, Custom Objects, Dynamic Bytecode Execution</text>
  </g>

  <!-- LAYER +2 -->
  <g filter="url(#shadow)">
    <rect x="40" y="175" width="770" height="85" rx="8" fill="url(#layer2)" stroke="#86efac" stroke-width="1.5"/>
    <rect x="55" y="188" width="70" height="22" rx="4" fill="#16a34a"/>
    <text x="63" y="203" class="badge" fill="#ffffff">Layer +2</text>
    <text x="135" y="204" class="layer-title">Object-Specific Type Allocators &amp; Freelists</text>
    <text x="135" y="226" class="layer-desc">Dedicated caches for fast allocation: Small Integer Cache (-5 to 256), Interned Strings, List/Dict freelists</text>
  </g>

  <!-- LAYER +1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="275" width="770" height="110" rx="8" fill="url(#layer1)" stroke="#fde047" stroke-width="1.5"/>
    <rect x="55" y="288" width="70" height="22" rx="4" fill="#ca8a04"/>
    <text x="63" y="303" class="badge" fill="#ffffff">Layer +1</text>
    <text x="135" y="304" class="layer-title">Python Core / 'pymalloc' (Small Object Allocator &lt;= 512 Bytes)</text>
    
    <!-- Sub-boxes for Arenas, Pools, Blocks -->
    <rect x="135" y="325" width="180" height="45" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="1"/>
    <text x="145" y="343" class="box-label" fill="#854d0e">Arenas (256 KB)</text>
    <text x="145" y="360" font-size="10" fill="#a16207">Contiguous chunks from OS</text>

    <rect x="330" y="325" width="200" height="45" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="1"/>
    <text x="340" y="343" class="box-label" fill="#854d0e">Pools (4 KB)</text>
    <text x="340" y="360" font-size="10" fill="#a16207">Divided per size-class (16, 32...)</text>

    <rect x="545" y="325" width="245" height="45" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="1"/>
    <text x="555" y="343" class="box-label" fill="#854d0e">Blocks (8 - 512 bytes)</text>
    <text x="555" y="360" font-size="10" fill="#a16207">Carved slots returned to PyObject in O(1)</text>
  </g>

  <!-- LAYER 0 -->
  <g filter="url(#shadow)">
    <rect x="40" y="400" width="770" height="75" rx="8" fill="url(#layer0)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="55" y="413" width="70" height="22" rx="4" fill="#475569"/>
    <text x="63" y="428" class="badge" fill="#ffffff">Layer 0</text>
    <text x="135" y="429" class="layer-title">Operating System Virtual Memory / C-Runtime</text>
    <text x="135" y="452" class="layer-desc">system malloc(), free(), mmap(), VirtualAlloc(). Handles large objects &gt; 512 bytes &amp; Arenas</text>
  </g>
</svg>
