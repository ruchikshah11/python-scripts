<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 20px; fill: #0f172a; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 14px; fill: #1e293b; }
      .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .code-snip { font-family: monospace; font-size: 11px; fill: #0369a1; }
    </style>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="900" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="35" y="40" class="title">Complete Object Lifecycle in Python (CPython)</text>
  <text x="35" y="62" class="sub">From initial allocation on the private heap through active reference manipulation to final deallocation</text>

  <!-- Step 1: Allocation -->
  <g transform="translate(35, 110)">
    <rect width="180" height="230" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="18" fill="#0284c7"/>
    <text x="86" y="40" fill="#ffffff" font-weight="bold" font-size="14">1</text>
    <text x="90" y="80" text-anchor="middle" class="step-title">1. ALLOCATION</text>
    <text x="90" y="105" text-anchor="middle" class="code-snip">tp_alloc / __new__</text>
    <text x="20" y="135" class="step-desc">• Requests block from</text>
    <text x="28" y="152" class="step-desc">pymalloc pool</text>
    <text x="20" y="175" class="step-desc">• Sets ob_type pointer</text>
    <text x="20" y="195" class="step-desc">• Initializes ob_refcnt = 1</text>
  </g>

  <path d="M 220 220 L 250 220" stroke="#0284c7" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <!-- Step 2: Initialization -->
  <g transform="translate(255, 110)">
    <rect width="180" height="230" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="18" fill="#16a34a"/>
    <text x="86" y="40" fill="#ffffff" font-weight="bold" font-size="14">2</text>
    <text x="90" y="80" text-anchor="middle" class="step-title">2. INITIALIZATION</text>
    <text x="90" y="105" text-anchor="middle" class="code-snip">__init__(self, ...)</text>
    <text x="20" y="135" class="step-desc">• Binds attributes</text>
    <text x="28" y="152" class="step-desc">to self.__dict__</text>
    <text x="20" y="175" class="step-desc">• Populates payload data</text>
    <text x="20" y="195" class="step-desc">• Object ready for use</text>
  </g>

  <path d="M 440 220 L 470 220" stroke="#0284c7" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <!-- Step 3: Usage & Lifetime -->
  <g transform="translate(475, 110)">
    <rect width="180" height="230" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
    <circle cx="90" cy="35" r="18" fill="#ca8a04"/>
    <text x="86" y="40" fill="#ffffff" font-weight="bold" font-size="14">3</text>
    <text x="90" y="80" text-anchor="middle" class="step-title">3. REFERENCING</text>
    <text x="90" y="105" text-anchor="middle" class="code-snip">Py_INCREF / Py_DECREF</text>
    <text x="20" y="135" class="step-desc">• Named variables bind</text>
    <text x="20" y="155" class="step-desc">• Passed to functions</text>
    <text x="20" y="175" class="step-desc">• Placed in containers</text>
    <text x="20" y="195" class="step-desc">• Tracked by Cyclic GC</text>
  </g>

  <path d="M 660 220 L 690 220" stroke="#0284c7" stroke-width="3" marker-end="url(#flow-arrow)"/>

  <!-- Step 4: Deallocation -->
  <g transform="translate(695, 110)">
    <rect width="170" height="230" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <circle cx="85" cy="35" r="18" fill="#dc2626"/>
    <text x="81" y="40" fill="#ffffff" font-weight="bold" font-size="14">4</text>
    <text x="85" y="80" text-anchor="middle" class="step-title">4. DEALLOCATION</text>
    <text x="85" y="105" text-anchor="middle" class="code-snip">tp_dealloc / __del__</text>
    <text x="15" y="135" class="step-desc">• Triggered at refcount=0</text>
    <text x="15" y="155" class="step-desc">• Optional __del__ executed</text>
    <text x="15" y="175" class="step-desc">• Block returned to Pool</text>
    <text x="15" y="195" class="step-desc">• Memory ready for reuse</text>
  </g>

  <!-- Bottom Banner Note -->
  <rect x="35" y="360" width="830" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="45" y="382" class="step-desc">Note: Memory is reclaimed instantly when refcount drops to 0, or periodically by Cyclic GC if in a circular cycle.</text>
</svg>
